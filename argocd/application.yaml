apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-apps
  namespace: argocd
  labels:
    app: workshop-apps
    environment: production
    managed-by: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kenerry-serain/wks-ia-preview.git
    targetRevision: main
    path: kubernetes/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
