apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-backend
  labels:
    app: workshop-backend
    version: v1.0
    environment: production
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workshop-backend
  template:
    metadata:
      labels:
        app: workshop-backend
        version: v1.0
        environment: production
        managed-by: kubectl
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: 968225077300.dkr.ecr.us-east-1.amazonaws.com/workshop-backend:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /backend/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /backend/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
